<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AI한술 · Threads 연결</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#faf7f0;color:#222;margin:0;padding:32px 16px;line-height:1.6}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px}
#code{display:block;word-break:break-all;background:#fff;border:2px solid #222;border-radius:8px;padding:14px;font:16px/1.5 ui-monospace,Menlo,monospace;margin:12px 0}
button{font-size:17px;padding:10px 18px;border:0;border-radius:8px;background:#C43422;color:#fff;cursor:pointer}
.muted{color:#666;font-size:14px}
</style></head><body><main>
<h1 id="t">Threads 연결 코드</h1>
<p id="msg">아래 코드를 복사해서 Claude에게 붙여넣어 주세요. 코드는 1시간 안에 한 번만 쓸 수 있어요.</p>
<code id="code"></code>
<button id="copy">코드 복사</button> <span id="ok" class="muted"></span>
<p class="muted">이 페이지는 코드를 화면에 보여 주기만 하고 어디로도 보내지 않습니다.</p>
</main>
<script>
const q=new URLSearchParams(location.search);
const code=(q.get("code")||"").replace(/#_$/,"");
const el=document.getElementById("code");
if(q.get("error")){document.getElementById("t").textContent="연결이 취소됐어요";document.getElementById("msg").textContent=(q.get("error_description")||q.get("error")).replace(/\+/g," ");el.style.display="none";document.getElementById("copy").style.display="none";}
else if(!code){document.getElementById("msg").textContent="코드가 없습니다. 승인 창에서 다시 시작해 주세요.";el.style.display="none";document.getElementById("copy").style.display="none";}
else{el.textContent=code;}
document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(code).then(()=>{document.getElementById("ok").textContent="복사됨"});
history.replaceState(null,"",location.pathname);
</script></body></html>
